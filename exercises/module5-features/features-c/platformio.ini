; Module 5 Track B — features in C on the RAK4631 (nRF52840)
; Requires the RAK board patch from setup-guide.md (wiscore_rak4631 board def).
;
; Two build environments:
;   naive  (default) — plain-C DFT, ZERO external libraries. Always builds.
;   cmsis            — real ARM CMSIS-DSP hardware FFT, for the runtime comparison.
;                      Fetch lib/CMSIS-DSP first (see README "Optional: real
;                      CMSIS-DSP FFT"); build/flash with `pio run -e cmsis`.

[platformio]
default_envs = naive          ; bare `pio run` builds only the dependency-free path

[env]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

; chain+ evaluates preprocessor conditionals, so the arm_math.h include guarded
; by #ifdef USE_CMSIS_DSP stays invisible to the naive build — CMSIS-DSP is only
; compiled for -e cmsis.
lib_ldf_mode = chain+

lib_deps =
    adafruit/Adafruit LIS3DH @ ^1.3.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1

build_flags =
    ; newlib-nano: link float printf support — validate_features.py parses the
    ; %.6f/%.6e output, which prints blank/garbage without this
    -Wl,-u,_printf_float

[env:naive]
; Default class build: plain-C DFT (band_energies_naive). No CMSIS, no lib fetch.

[env:cmsis]
; Real CMSIS-DSP FFT (band_energies_cmsis) + the naive-vs-CMSIS timing harness.
; Needs the vendored lib/CMSIS-DSP/ (fetched at setup). ARM_MATH_CM4 selects the
; Cortex-M4 DSP path when features.cpp parses arm_math.h.
build_flags =
    ${env.build_flags}
    -DUSE_CMSIS_DSP
    -DARM_MATH_CM4
    -DARM_MATH_LOOPUNROLL
