; Module 5 Track B — features in C on the RAK4631 (nRF52840)
; Requires the RAK board patch from setup-guide.md (wiscore_rak4631 board def).

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit LIS3DH @ ^1.3.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    adafruit/Adafruit BusIO @ ^1.16.1
    ; VERIFY: CMSIS-DSP availability. The Adafruit nRF52 BSP ships CMSIS *core*
    ; headers but does not link the DSP library by default. Options, in order
    ; of preference — test before class:
    ;   1) Arm's Arduino-packaged CMSIS-DSP library:
    ;        https://github.com/ARM-software/CMSIS-DSP.git
    ;      (check that the repo revision used carries Arduino library metadata)
    ;   2) Link the math lib bundled with the BSP by adding to build_flags:
    ;        -L"$PROJECT_PACKAGES_DIR/framework-arduinoadafruitnrf52/cores/nRF5/CMSIS/..." -larm_cortexM4lf_math
    ;      (path varies by BSP version)
    ;   3) Fallback that always works: -DUSE_NAIVE_DFT (plain-C DFT, slower,
    ;      numerically equivalent) — nobody gets blocked in class.
    https://github.com/ARM-software/CMSIS-DSP.git

build_flags =
    -DARM_MATH_CM4
    -DARM_MATH_LOOPUNROLL
    ; newlib-nano: link float printf support — validate_features.py parses the
    ; %.6f/%.6e output, which prints blank/garbage without this
    -Wl,-u,_printf_float
    ; -DUSE_NAIVE_DFT        ; uncomment to bypass CMSIS-DSP entirely (see VERIFY above)
