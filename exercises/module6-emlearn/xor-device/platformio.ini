; Module 6 — emlearn XOR classifier on the RAK4631 (nRF52840)
; Requires the RAK board patch from setup-guide.md (wiscore_rak4631 board def).
;
; The model header is GENERATED, not checked in:
;   cd ../xor-train && python train_xor.py && cp xor_model.h ../xor-device/include/
;
; lib/emlearn holds the emlearn runtime headers (README Part 1):
;   cp -r "$(python -c 'import emlearn; print(emlearn.includedir)')" lib/emlearn
; Recent emlearn versions #include <eml_trees.h> from the generated header
; even with method='inline', so this copy is REQUIRED — same step as
; Module 7.1's rf-features project.
; VERIFY: confirm against the pinned emlearn version (setup-guide.md §4).

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

build_flags =
    -I lib/emlearn
    ; newlib-nano: link float printf support so %.2f prints real numbers
    -Wl,-u,_printf_float
