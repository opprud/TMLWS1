; Module 3 / Exercise A — Accelerometer data forwarder for Edge Impulse
; Streams x,y,z CSV over serial at a fixed 100 Hz for edge-impulse-data-forwarder.
; Requires the RAK board patch (see setup-guide.md, section 2)

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit LIS3DH
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
