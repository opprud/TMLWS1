; Module 3 / Exercise B — Microphone RAM recorder
; Records N seconds of 16 kHz PCM to RAM, dumps it as base64 over serial.
; Convert on the PC with pcm_to_wav.py, upload with edge-impulse-uploader.
; Requires the RAK board patch (see setup-guide.md, section 2)

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

; Audio uses the Adafruit BSP's bundled `PDM` Arduino library (<PDM.h>) — the
; raw nrfx PDM *driver* (nrfx_pdm.c) is NOT shipped by this BSP, only its header,
; so nrfx_pdm_init()/NRFX_PDM_DEFAULT_CONFIG do not build. The PDM library is
; auto-discovered from the framework; no extra lib_deps or build_flags needed.
; The library's 16 kHz mode runs at ratio 80 = exactly 16.000 kHz (no --rate).
