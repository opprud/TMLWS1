; Module 7.1 - Random Forest fan classifier on RAK4631 (nRF52840)
; Requires the RAK board patch from the setup guide (wiscore_rak4631 board def).

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit LIS3DH@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14

; lib/emlearn holds the emlearn runtime headers, VENDORED at 0.23.2 (see VERSION.txt):
; only eml_trees.h -> eml_common.h -> eml_log.h, the closure the generated fan_model.h
; pulls in (it #includes <eml_trees.h> even with method='inline'). Do NOT copy the whole
; emlearn.includedir — that is the Python package dir (43 headers + 46 .py files).
; Same three files as module6-emlearn/xor-device; keep the pip pin in sync (README Step 0).
build_flags =
    -I lib/emlearn
    ; newlib-nano: link float printf support, or the %f in the failing-window
    ; feature dump (main.cpp) prints nothing useful
    -Wl,-u,_printf_float
