; Module 7.1 - Random Forest fan classifier on RAK4631 (nRF52840)
; Requires the RAK board patch from the setup guide (wiscore_rak4631 board def).

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit LIS3DH@^1.3.0
    adafruit/Adafruit Unified Sensor@^1.1.14

; lib/emlearn holds the emlearn runtime headers (README step 3):
;   cp -r "$(python -c 'import emlearn; print(emlearn.includedir)')" lib/emlearn
build_flags =
    -I lib/emlearn
