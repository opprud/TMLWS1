; Module 2 / Exercise 2 — RAK1904 (LIS3DH) accelerometer over I2C
; Requires the RAK board patch (see setup-guide.md, section 2)

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

lib_deps =
    adafruit/Adafruit LIS3DH
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
