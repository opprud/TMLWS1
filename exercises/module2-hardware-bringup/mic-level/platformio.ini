; Module 2 / Exercise 3 — RAK18000 PDM microphone, RMS level meter
; Requires the RAK board patch (see setup-guide.md, section 2)

[env:wiscore_rak4631]
platform = nordicnrf52
board = wiscore_rak4631
framework = arduino
monitor_speed = 115200

; The nrfx PDM driver ships with the Adafruit nRF52 BSP.
; VERIFY: if the build fails with "NRFX_PDM_ENABLED" / undefined nrfx_pdm_init,
; uncomment the next line to force-enable the driver:
; build_flags = -DNRFX_PDM_ENABLED=1
